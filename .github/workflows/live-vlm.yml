name: Live VLM Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-vlm:
    name: Live OpenRouter VLM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies from lockfile
        run: uv sync --frozen --group dev

      - name: Run live VLM smoke
        env:
          VLM_PROVIDER: "openrouter"
          VLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_LIVE_VLM_SMOKE: "1"
        run: uv run --locked --python 3.13 pytest tests/live/test_live_vlm.py -q
